<style>
        body { background-color: #F2F2F7; }
        .ios-list-item:active { background-color: #E5E5EA; transform: scale(0.98); }
        .checkbox-custom:checked + label { text-decoration: line-through; color: #a7a8ad; }
    </style>
</head>
<body class="text-on-background font-body-sm h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background w-full sticky top-0 z-50 flat no shadows">
<div class="flex justify-between items-center px-margin-mobile py-stack-md max-w-[1024px] mx-auto">
<button class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-semibold text-on-surface text-body-sm lowercase">chronos</h1>
<div class="hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<img class="w-8 h-8 rounded-full object-cover" data-alt="A small circular user profile photo showing a person in soft lighting. The image should be minimalist and fit a clean, high-utility aesthetic. Muted earthy tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA3VHg_vhk8z6keJJNdjf7UDDQnxakIABiUjZkmEEyEi0BFMJkBFNTfQkl_plOng8Xr1qz3nQK_dzXidY0fH4LLxGbUE9RhLRBfibvgO5tvcjtg-Qxa-vlOKz2soEQ_5EMn5iJjXrUNVFDadt2Vz5GRcFV3O99LL9YS_j0_eyaXwb1orpsyrZNG5WWBbMm_cLsaBdM61-kXnVHuaz29zutFPfNMk7C0CJDTovTJI5SSGkMuUn08WyIONGnh5CkajawA1hTAJfR3ZLk">
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pb-[80px] px-margin-mobile max-w-[1024px] mx-auto w-full mt-stack-md space-y-stack-lg">
<!-- Header Section -->
<div class="flex justify-between items-end">
<div>
<h2 class="font-display-lg text-display-lg-mobile md:text-display-lg">Tasks</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-unit">5 remaining today</p>
</div>
</div>
<!-- Task Categories -->
<div class="flex space-x-gutter overflow-x-auto pb-unit no-scrollbar">
<button class="px-4 py-2 rounded-full bg-primary-container text-on-primary font-label-sm text-label-sm whitespace-nowrap active:scale-95 transition-transform duration-200 shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">All Tasks</button>
<button class="px-4 py-2 rounded-full bg-surface text-on-surface-variant font-label-sm text-label-sm whitespace-nowrap active:scale-95 transition-transform duration-200 border border-outline-variant">Work</button>
<button class="px-4 py-2 rounded-full bg-surface text-on-surface-variant font-label-sm text-label-sm whitespace-nowrap active:scale-95 transition-transform duration-200 border border-outline-variant">Personal</button>
</div>
<!-- Task List: Work -->
<section class="space-y-stack-sm">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase ml-4">Work</h3>
<div class="bg-surface rounded-lg shadow-[0px_4px_12px_rgba(0,0,0,0.05)] overflow-hidden">
<!-- Task Item 1 -->
<div class="ios-list-item flex items-center p-4 min-h-[44px] border-b border-surface-variant transition-colors duration-150">
<div class="flex-shrink-0 mr-gutter">
<input class="peer hidden" id="task1" type="checkbox">
<label class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center cursor-pointer peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors" for="task1">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</label>
</div>
<div class="flex-1">
<label class="font-body-lg text-body-lg cursor-pointer block peer-checked:text-tertiary peer-checked:line-through transition-colors" for="task1">Finalize Q3 Presentation</label>
</div>
<div class="flex-shrink-0 text-on-surface-variant">
<span class="font-body-sm text-body-sm">2:00 PM</span>
</div>
</div>
<!-- Task Item 2 (Completed) -->
<div class="ios-list-item flex items-center p-4 min-h-[44px] transition-colors duration-150">
<div class="flex-shrink-0 mr-gutter">
<input checked="" class="peer hidden" id="task2" type="checkbox">
<label class="w-6 h-6 rounded-full border-2 border-primary-container bg-primary-container flex items-center justify-center cursor-pointer transition-colors" for="task2">
<span class="material-symbols-outlined text-on-primary text-[16px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</label>
</div>
<div class="flex-1">
<label class="font-body-lg text-body-lg cursor-pointer block text-tertiary line-through transition-colors" for="task2">Email Team Updates</label>
</div>
<div class="flex-shrink-0 text-on-surface-variant">
<span class="font-body-sm text-body-sm">10:00 AM</span>
</div>
</div>
</div>
</section>
<!-- Task List: Personal -->
<section class="space-y-stack-sm mt-stack-lg">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase ml-4">Personal</h3>
<div class="bg-surface rounded-lg shadow-[0px_4px_12px_rgba(0,0,0,0.05)] overflow-hidden">
<!-- Task Item 3 -->
<div class="ios-list-item flex items-center p-4 min-h-[44px] border-b border-surface-variant transition-colors duration-150">
<div class="flex-shrink-0 mr-gutter">
<input class="peer hidden" id="task3" type="checkbox">
<label class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center cursor-pointer peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors" for="task3">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</label>
</div>
<div class="flex-1">
<label class="font-body-lg text-body-lg cursor-pointer block peer-checked:text-tertiary peer-checked:line-through transition-colors" for="task3">Grocery Shopping</label>
</div>
<div class="flex-shrink-0 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="shopping_cart">shopping_cart</span>
</div>
</div>
<!-- Task Item 4 -->
<div class="ios-list-item flex items-center p-4 min-h-[44px] transition-colors duration-150">
<div class="flex-shrink-0 mr-gutter">
<input class="peer hidden" id="task4" type="checkbox">
<label class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center cursor-pointer peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors" for="task4">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</label>
</div>
<div class="flex-1">
<label class="font-body-lg text-body-lg cursor-pointer block peer-checked:text-tertiary peer-checked:line-through transition-colors" for="task4">Call Mom</label>
</div>
</div>
</div>
</section>
<!-- Add Task FAB -->
<button class="fixed bottom-[90px] right-margin-mobile w-14 h-14 bg-primary-container rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform duration-200 z-40 md:hidden">
<span class="material-symbols-outlined text-on-primary" data-icon="add">add</span>
</button>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md fixed bottom-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-[0px_-1px_0px_0px_rgba(0,0,0,0.05)] md:hidden">
<div class="flex justify-around items-center pt-2 pb-safe px-margin-mobile h-[72px]">
<!-- Calendar (Inactive) -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:text-primary-container active:scale-90 transition-transform duration-150 w-16">
<span class="material-symbols-outlined mb-1" data-icon="calendar_month">calendar_month</span>
<span class="font-label-sm text-label-sm">Calendar</span>
</button>
<!-- Alarms (Inactive) -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:text-primary-container active:scale-90 transition-transform duration-150 w-16">
<span class="material-symbols-outlined mb-1" data-icon="alarm">alarm</span>
<span class="font-label-sm text-label-sm">Alarms</span>
</button>
<!-- Tasks (Active) -->
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-semibold hover:text-primary-container active:scale-90 transition-transform duration-150 w-16">
<span class="material-symbols-outlined mb-1" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm">Tasks</span>
</button>
</div>
</nav>
<!-- Add safe area padding for bottom nav on iOS -->
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    </style>
<script>
        // Simple logic for custom checkboxes to toggle line-through state on the label
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const label = e.target.closest('.ios-list-item').querySelector('.flex-1 label');
                if(e.target.checked) {
                    label.classList.add('text-tertiary', 'line-through');
                } else {
                    label.classList.remove('text-tertiary', 'line-through');
                }
            });
        });
    </script>
</body></html>
